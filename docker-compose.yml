version: "3.8"

services:
  db:
    image: mysql:8
    container_name: todo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: todo
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql


  app:
    build: .
    container_name: todo-app
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root@123
      DB_NAME: todo
      APP_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  db_data:
